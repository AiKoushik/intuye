[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intuye-backend"
license = {text = "AGPL-3.0-or-later"}
version = "0.1.0"
description = "Intuye API: auth, App Attest, LangChain Deep Agents, shared scene library, curation and FSRS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43",
  "cbor2>=5.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "deepagents>=0.7.37,<0.8",
  "langchain>=1.5",
  "langgraph>=1.0",
  "langchain-core>=1.8",
  "langchain-openai>=1.0",
  "langchain-anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
