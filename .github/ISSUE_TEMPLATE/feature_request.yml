name: Feature idea
description: Suggest something Intuye could do
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: When would you use it? What are you trying to say or get ready for?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Say, Scenes and library, Rehearse, Words and review, Progress, Capture and privacy, A new language, Other]
