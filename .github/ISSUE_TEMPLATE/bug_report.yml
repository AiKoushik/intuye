name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [iPhone app, Web test build, Backend or API, Docs]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Say\n2. Type ...\n3. ..."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 0.1.0 or 867bb73
  - type: markdown
    attributes:
      value: Please don't paste personal data or sentences you'd rather keep private. Security problems go through SECURITY.md, not issues.
