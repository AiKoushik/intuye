version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web/e2e
    schedule:
      interval: monthly
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
