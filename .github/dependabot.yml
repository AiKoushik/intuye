version: 2
# Updates arrive as one grouped pull request per ecosystem, against develop.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web/e2e
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      actions:
        patterns: ["*"]
